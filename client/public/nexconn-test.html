<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexconn Chat SDK Spike Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    input, button { padding: 8px 12px; margin: 4px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 4px; }
    button { background: #3b82f6; cursor: pointer; }
    #log { margin-top: 16px; padding: 12px; background: #020617; border: 1px solid #1e293b; border-radius: 6px; font-family: monospace; height: 300px; overflow-y: auto; }
    .entry { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h2>Nexconn Chat SDK Spike Test</h2>
  <div>
    <input id="appKey" placeholder="App Key" style="width: 250px;" />
    <input id="token" placeholder="User Access Token" style="width: 350px;" />
    <button onclick="testConnect()">Connect</button>
  </div>
  <div style="margin-top: 10px;">
    <input id="targetId" placeholder="Target User or Group ID" style="width: 250px;" />
    <input id="msgText" placeholder="Message text" style="width: 300px;" />
    <button onclick="testSend()">Send Direct</button>
  </div>
  <div id="log"></div>

  <script type="module">
    import { NCEngine, DirectChannel, SendTextMessageParams, MessageHandler, ConnectionStatusHandler } from '/node_modules/@nexconn/chat/index.esm.js';

    function log(msg) {
      const el = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'entry';
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    }

    window.testConnect = async function() {
      const appKey = document.getElementById('appKey').value.trim();
      const token = document.getElementById('token').value.trim();
      if (!appKey || !token) {
        log('Error: Please provide both App Key and Token');
        return;
      }
      try {
        log('Initializing NCEngine...');
        NCEngine.initialize({ appKey });

        NCEngine.addConnectionStatusHandler('test-conn', new ConnectionStatusHandler({
          onConnectionStatusChanged(e) {
            log(`ConnectionStatus changed: ${e.status} (code: ${e.code})`);
          }
        }));

        NCEngine.addMessageHandler('test-msg', new MessageHandler({
          onMessageReceived({ messages }) {
            for (const m of messages) {
              log(`Received: [from ${m.senderUserId}] ${JSON.stringify(m.content)}`);
            }
          }
        }));

        log('Connecting with token...');
        const res = await NCEngine.connect(token);
        log(`Connected successfully: ${JSON.stringify(res)}`);
      } catch (err) {
        log(`Connect error: ${err.message || err}`);
      }
    };

    window.testSend = async function() {
      const targetId = document.getElementById('targetId').value.trim();
      const text = document.getElementById('msgText').value.trim();
      if (!targetId || !text) {
        log('Error: Please provide targetId and text');
        return;
      }
      try {
        log(`Sending text to ${targetId}...`);
        const channel = new DirectChannel(targetId);
        const res = await channel.sendMessage(new SendTextMessageParams({ content: text }));
        log(`Message sent! Message ID: ${res?.messageId || 'ok'}`);
      } catch (err) {
        log(`Send error: ${err.message || err}`);
      }
    };
  </script>
</body>
</html>
